<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb IP Geolocations</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .title {
            text-align: center;
            padding: 20px;
            background: white;
            margin: 0;
            border-bottom: 1px solid #ddd;
        }
        
        .title h1 {
            margin: 0;
            font-size: 28px;
            color: #333;
            font-weight: normal;
        }
        
        .title p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 16px;
            font-style: italic;
        }
        
        #map {
            height: calc(100vh - 120px);
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>www.airbnb.com</h1>
        <p>IP geolocations</p>
    </div>
    
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize map
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        
        // Add tile layer - using the same style as the example
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Simple red circle markers
        const redMarker = L.divIcon({
            className: 'red-marker',
            html: '<div style="width: 8px; height: 8px; background-color: #ff4444; border-radius: 50%; border: 1px solid white;"></div>',
            iconSize: [8, 8],
            iconAnchor: [4, 4]
        });
        
        // Load GeoJSON data
        fetch('airbnb_locations.geojson')
            .then(response => response.json())
            .then(data => {
                console.log('Loading IP locations...');
                
                data.features.forEach(feature => {
                    const coords = feature.geometry.coordinates;
                    const props = feature.properties;
                    
                    // Skip invalid coordinates
                    if (coords[0] === 0 && coords[1] === 0) return;
                    
                    // Simple popup content
                    const popupContent = `
                        <b>IP:</b> ${props.ip}<br>
                        <b>URL:</b> ${props.url}
                    `;
                    
                    // Add simple red marker
                    L.marker([coords[1], coords[0]], { icon: redMarker })
                        .addTo(map)
                        .bindPopup(popupContent);
                });
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
                alert('Could not load airbnb_locations.geojson file');
            });
    </script>
</body>
</html>
